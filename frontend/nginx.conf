# TLS-terminating nginx for the SPA, following the jackstudio.app pattern (~/github/hobbyland):
#   browser ──HTTPS──▶ shared Caddy (Let's Encrypt, :443) ──HTTPS──▶ cyberstock-web:60003 (self-signed)
# It also reverse-proxies the backend and AI service on the same origin, so WebSocket (wss://)
# and SSE share the page's origin and the web app needs no CORS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Real client scheme: Caddy forwards X-Forwarded-Proto=https
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# Internal plain-HTTP listener for the container health check only (loopback, not published)
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
}

server {
    listen 60003 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Plain HTTP sent to the TLS port → redirect to HTTPS on the same host:port
    error_page 497 =301 https://$http_host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }

    location /ai/ {
        proxy_pass http://analytics-ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Server-Sent Events: stream immediately, keep long-lived connections open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed assets: cache forever (add_header in a location replaces inherited ones, so repeat HSTS)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Service worker and manifest must always revalidate
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
