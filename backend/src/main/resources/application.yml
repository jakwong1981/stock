server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: cyberstock-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cyberstock}
    username: ${POSTGRES_USER:cyberstock}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  market:
    provider: ${MARKET_DATA_PROVIDER:mock}
    tick-interval-ms: ${MARKET_TICK_INTERVAL_MS:250}
    finnhub-api-key: ${FINNHUB_API_KEY:}
    finnhub-poll-seconds: ${FINNHUB_POLL_SECONDS:15}
    yahoo-poll-seconds: ${YAHOO_POLL_SECONDS:15}

logging:
  level:
    root: INFO
